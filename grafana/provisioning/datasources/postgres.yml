# Grafana가 Django 서버와 같은 Postgres를 읽기 전용으로 조회한다.
# 쓰기 권한은 없음 — grafana_reader 롤은 SELECT만 부여받음(별도 생성 스크립트 참고).
apiVersion: 1

datasources:
  - name: vuln-checker Postgres
    type: postgres
    access: proxy
    url: db:5432
    database: ${POSTGRES_DB}
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_READER_PASSWORD}
